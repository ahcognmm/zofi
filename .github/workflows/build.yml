name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Wayland build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - run: zig build
      - run: zig build test --summary all

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test --summary all
      - name: Rank harness smoke test
        run: printf 'firefox\nfile-manager\nvim\n' | ./zig-out/bin/zofi fi
      - name: Window smoke test
        # Opens the real AppKit window in dmenu mode and kills it after 5s.
        # 142 (SIGALRM) = still up when the alarm fired; 1 = cancelled, e.g.
        # the window lost focus. Anything else means it crashed.
        run: |
          set +e
          printf 'one\ntwo\nthree\n' | ZOFI_DEBUG=1 perl -e 'alarm 5; exec @ARGV' ./zig-out/bin/zofi -dmenu
          status=$?
          echo "exit status: $status"
          [ "$status" -eq 142 ] || [ "$status" -eq 1 ]
